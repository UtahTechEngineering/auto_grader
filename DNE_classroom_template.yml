name: Run Grader and Post Feedback

on:
  push:
    branches:
      - main  # or the default branch used for student submissions

jobs:
  grade-and-comment:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout student repository
      uses: actions/checkout@v3
      with:
        submodules: 'true'
        token: ${{ secrets.GH_PAT }}

    - name: Checkout private data repo
      uses: actions/checkout@v4
      with:
        repository: <your orginization name>/_<root>_private_data # private grader repository AND originization name goes here
        token: ${{ secrets.GH_PAT }} # `PAT` is a secret that contains your PAT
        path: _auto_grader_testing_private_data # private grader repository goes here

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Print file structure
      id: file_structure
      run: |
        echo "Current directory: $(pwd)"
        echo "File structure:"
        tree
      shell: bash
    - name: Dump file structure
      run: echo "${{ steps.file_structure.outputs.tree }}"

    - name: Install dependencies
      # working-directory: .
      run: |
        pip install -r requirements.txt || true

    - name: Run grading script
      id: run_grader
      run: |
        python DNE_github_grade_on_push.py --github_actor ${{ github.actor }} --canvas_api_token ${{ secrets.CANVAS_API_TOKEN }}
        echo "GRADE_OUTPUT<<EOF" >> $GITHUB_ENV
        cat _pull_request_comment.md >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Find Feedback PR
      id: find_pr
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GH_PAT }}
        script: |
          const { data: pulls } = await github.rest.pulls.list({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: "open",
          });

          const feedbackPR = pulls.find(pr => pr.title.startsWith("Feedback"));

          if (feedbackPR) {
            core.setOutput("pr_number", feedbackPR.number);
          } else {
            core.setFailed("No Feedback pull request found.");
          }

    - name: Comment on Feedback PR
      if: success()
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GH_PAT }}
        script: |
          const output = process.env.GRADE_OUTPUT;
          const prNumber = core.getInput('pr_number') || "${{ steps.find_pr.outputs.pr_number }}";

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            body: `${output}`
          });

